<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Acesse sua biblioteca pessoal na Bibliotheca Athenae.">

    <title>Entrar | Bibliotheca Athenae</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/acessibilidade.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card" aria-labelledby="titulo-login">

            <!-- Identidade visual -->
            <header class="login-header">

                <div class="login-emblem" aria-hidden="true">
                    ♜
                </div>

                <h1 id="titulo-login">Bibliotheca Athenae</h1>

                <p class="login-motto">
                    Scientia, Sapientia et Memoria
                </p>

                <div class="login-divider" aria-hidden="true">
                    ❧
                </div>

                <h2>Bem-vindo(a) de volta</h2>

                <p class="login-description">
                    Entre em sua biblioteca pessoal e continue sua jornada pelo conhecimento.
                </p>

            </header>

            <!-- Formulário -->
            <form id="login-form" class="login-form">

                <div class="form-group">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Digite seu e-mail"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">Senha</label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            class="form-control"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrar-senha"
                            class="password-toggle"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>

                <div class="login-options">

                    <label class="remember-option">
                        <input type="checkbox" id="lembrar-login">
                        <span>Manter sessão</span>
                    </label>

                </div>

                <!-- Mensagens de erro ou sucesso -->
                <div
                    id="mensagem-login"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button type="submit" class="login-button">
                    Entrar na biblioteca
                </button>

            </form>

            <!-- Rodapé -->
            <footer class="login-footer">

                <p>
                    Um espaço dedicado à leitura, à memória e ao conhecimento.
                </p>

                <span>Bibliotheca Athenae © 2026</span>

            </footer>

        </section>

    </main>

    <!-- Painel de acessibilidade -->
    <div class="accessibility-container">

        <button
            type="button"
            id="botao-acessibilidade"
            class="accessibility-button"
            aria-label="Abrir opções de acessibilidade"
            aria-expanded="false"
            aria-controls="painel-acessibilidade"
        >
            ⚙ Acessibilidade
        </button>

        <section
            id="painel-acessibilidade"
            class="accessibility-panel"
            aria-label="Opções de acessibilidade"
            hidden
        >

            <h2>Acessibilidade</h2>

            <div class="accessibility-group">
                <h3>Aparência</h3>

                <button type="button" id="modo-claro">
                    ☀ Modo claro
                </button>

                <button type="button" id="modo-escuro">
                    ☾ Modo escuro
                </button>
            </div>

            <div class="accessibility-group">
                <h3>Tamanho da fonte</h3>

                <button type="button" id="diminuir-fonte">
                    A− Diminuir
                </button>

                <button type="button" id="aumentar-fonte">
                    A+ Aumentar
                </button>
            </div>

            <div class="accessibility-group">
                <h3>Contraste</h3>

                <button type="button" id="alto-contraste">
                    Alto contraste
                </button>
            </div>

            <button type="button" id="restaurar-acessibilidade">
                Restaurar configurações
            </button>

        </section>

    </div>

    <!-- JavaScript -->
    <script src="js/acessibilidade.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
