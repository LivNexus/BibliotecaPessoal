<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bibliotheca Athenae</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS próprio -->
   <link rel="stylesheet" href="css/style.css">
   <link rel="stylesheet" href="css/pages.css">
   <link rel="stylesheet" href="css/acessibilidade.css">

</head>
<body>
    <!-- Menu lateral -->
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icon">✧</span>
            <h1>Biblioteca</h1>
        </div>
    <nav>
    <p class="menu-title">BIBLIOTECA</p>

    <a href="index.html">Início</a>
<a href="html/estante.html">Minha estante</a>
<a href="html/adicionar.html">Adicionar livro</a>
<a href="html/planejamento.html">Planejamento</a>
<a href="html/diario.html">Diário literário</a>
    </nav>
    </aside>
    <!-- Conteúdo principal -->
    <main class="main-content">
        <header class="topbar">

    <div>
        <h2>Bem-vindo à sua biblioteca.</h2>
    </div>

    <div class="topbar-actions">

        <a href="login.html" class="login-access-button">
            Entrar
        </a>

        <a href="html/adicionar.html" class="add-button">
            + Adicionar livro
        </a>

    </div>

</header>
        <!-- Resumo -->
        <section class="summary">

    <div class="summary-card">
        <span>Livros cadastrados</span>
        <strong id="total-livros">0</strong>
    </div>

    <div class="summary-card">
        <span>Livros lidos</span>
        <strong id="total-lidos">0</strong>
    </div>

    <div class="summary-card">
        <span>Em andamento</span>
        <strong id="total-lendo">0</strong>
    </div>

    <div class="summary-card">
        <span>Quero ler</span>
        <strong id="total-quero-ler">0</strong>
    </div>
</section>
        <!-- Livros recentes -->
        <section class="library-section">
            <div class="section-heading">
                <div>
                    <h2>Minha estante</h2>
                </div>
            </div>
            <!-- Categorias -->
            <div class="filters">
                <button class="filter active-filter" data-status="todos">Todos</button>
                <button class="filter" data-status="Lendo">Lendo</button>
                <button class="filter" data-status="Lidos">Lidos</button>
                <button class="filter" data-status="Quero ler">Quero ler</button>
                <button class="filter" data-status="Abandonados">Abandonados</button>
            </div>
            <!-- Carrossel de livros -->
<div class="carousel-wrapper">

    <button
        type="button"
        class="carousel-control carousel-prev"
        id="carousel-prev"
        aria-label="Ver livros anteriores">
        &#10094;
    </button>

    <div
        class="book-grid home-book-carousel"
        id="book-grid"
        aria-label="Livros da sua biblioteca">
    </div>

    <button
        type="button"
        class="carousel-control carousel-next"
        id="carousel-next"
        aria-label="Ver próximos livros">
        &#10095;
    </button>

</div>
    </main>

    <!-- PAINEL DE ACESSIBILIDADE -->
<div class="accessibility-container">

    <button
        type="button"
        id="botao-acessibilidade"
        class="accessibility-button"
        aria-label="Abrir opções de acessibilidade"
        aria-expanded="false"
        aria-controls="painel-acessibilidade">
        ⚙ Acessibilidade
    </button>

    <section
        id="painel-acessibilidade"
        class="accessibility-panel"
        aria-label="Opções de acessibilidade"
        hidden>

        <h2>Acessibilidade</h2>

        <div class="accessibility-group">
            <h3>Aparência</h3>

            <button type="button" id="modo-claro">
                ☀ Modo claro
            </button>

            <button type="button" id="modo-escuro">
                ☾ Modo escuro
            </button>
        </div>

        <div class="accessibility-group">
            <h3>Tamanho da fonte</h3>

            <button type="button" id="diminuir-fonte">
                A− Diminuir
            </button>

            <button type="button" id="aumentar-fonte">
                A+ Aumentar
            </button>
        </div>

        <div class="accessibility-group">
            <h3>Contraste</h3>

            <button type="button" id="alto-contraste">
                Alto contraste
            </button>
        </div>

        <button type="button" id="restaurar-acessibilidade">
            Restaurar configurações
        </button>

    </section>
</div>

<!-- JavaScript do projeto -->
<script src="js/storage.js"></script>
<script src="js/livros.js"></script>
<script src="js/app.js"></script>
<script src="js/acessibilidade.js"></script>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
